version: "3.9"

services:
  api:
    build: ./backend
    container_name: brainly-api
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: brainly-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: brainly
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data:

